[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-syscall-monitor"
version = "0.1.0"
description = "Lightweight command supervisor intercepting dangerous shell invocations, path traversals, and unauthorized port bindings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
sandbox-syscall-monitor = "sandbox_syscall_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sandbox_syscall_monitor*"]
